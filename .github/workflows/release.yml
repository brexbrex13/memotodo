name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./internal/board
      - run: go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --arch amd64 --out rsrc
      - run: go build -trimpath -ldflags="-H windowsgui -s -w" -o build/bin/MemoTodo.exe .
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item build/bin/MemoTodo.exe portable/
          Copy-Item README.md portable/
          Compress-Archive -Path portable/* -DestinationPath memotodo-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: memotodo-windows-amd64
          path: memotodo-windows-amd64.zip
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          draft: true
          generate_release_notes: true
          files: memotodo-windows-amd64.zip
